<style>
/* Layout: one phone-width column; top bar, scrolling screen, optional cart bar, bottom nav. Blue and white of Tunisian coastal towns, harissa red only for alerts. */
:root{

    --ok:#5FD39A; --ok-bg:#133526; --warn:#F2B84B; --warn-bg:#3A2B0E; --bad:#FF8A72; --bad-bg:#40201A;
    --c1:#7BA8F2; --c2:#4CC3B8; --c3:#E6B04A; --c4:#A99BDB;
    --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --outer:#080E1A; --bg:#0E1626; --surface:#172238; --raise:#1C2A44;
  --ink:#E8EDF6; --muted:#9AA8BF; --line:#2A3856;
  --accent:#7BA8F2; --on-accent:#0B1424; --tint:#1F3258;
  --ok:#5FD39A; --ok-bg:#133526; --warn:#F2B84B; --warn-bg:#3A2B0E; --bad:#FF8A72; --bad-bg:#40201A;

html,body{height:100%}
body{background:var(--outer);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;max-width:480px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.m{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;font-weight:700}
.u{font-size:.68em;font-weight:600;color:var(--muted);margin-inline-start:.3em;letter-spacing:.04em}

.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.icon-btn:active{background:var(--tint)}
svg.ic{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.main{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px 8px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--muted);font-size:.74rem;font-weight:600;min-height:56px}
.nav button.on{color:var(--accent);background:var(--tint)}
.cartbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(19,32,59,.08)}
.cb-view{display:flex;align-items:center;gap:8px;font-weight:700;min-height:48px;padding:0 6px}
.cb-n{background:var(--accent);color:var(--on-accent);min-width:28px;height:28px;border-radius:99px;display:grid;place-items:center;font-size:.85rem}
.cb-total{flex:1;text-align:end;font-size:1.15rem}
.btn{min-height:52px;padding:0 22px;border-radius:14px;font-weight:700;font-size:1rem;background:var(--tint);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:40px;padding:0 14px;font-size:.9rem;border-radius:11px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3,.sec-t{margin:0;font-size:1rem;font-weight:800}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:44px;padding:0 18px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;color:var(--muted)}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:.85rem;font-weight:700;color:var(--muted)}
.inp{width:100%;min-height:50px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:1.05rem}
.inp.num{font-variant-numeric:tabular-nums;font-weight:700}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--tint)}
textarea.inp{padding:10px 14px;min-height:80px}
.search{position:relative}
.search svg{position:absolute;inset-inline-start:14px;top:13px;color:var(--muted)}
.search .inp{padding-inline-start:46px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{min-height:96px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);padding:12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:4px;text-align:start;min-width:0}
.tile:active{background:var(--tint);border-color:var(--accent)}
.tile b{font-size:1.05rem;font-weight:800;overflow-wrap:anywhere}
.tl-price{font-size:1.1rem}
.tl-sub{font-size:.76rem;color:var(--muted);font-weight:600}
.tl-sub.lowt{color:var(--bad)}
.tile.empty{border-style:dashed;background:var(--raise)}
.tile.empty .tl-sub{color:var(--warn)}
.tile.add{align-items:center;justify-content:center;color:var(--accent);border-style:dashed}
.tile .cat{font-size:.7rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi.wide{grid-column:1/-1;background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.kpi.wide .u{color:inherit;opacity:.8}
.kpi .k{font-size:.82rem;font-weight:700;opacity:.8}
.kpi .v{font-size:1.5rem;font-weight:800;line-height:1.3}
.kpi.wide .v{font-size:2rem}
.row{display:flex;align-items:center;gap:10px;min-height:48px;justify-content:space-between}
.row+.row{border-top:1px dashed var(--line)}
.row .l{min-width:0;display:flex;flex-direction:column}
.row .l small{color:var(--muted);font-size:.78rem}
.badge{font-size:.72rem;font-weight:800;padding:2px 9px;border-radius:99px;white-space:nowrap}
.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.ok{background:var(--ok-bg);color:var(--ok)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.menu{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.menu button{display:flex;align-items:center;gap:14px;min-height:60px;padding:0 16px;text-align:start;font-weight:700}
.menu button+button{border-top:1px solid var(--line)}
.menu button svg{color:var(--accent)}
.menu button:active{background:var(--tint)}
.big-state{text-align:center;padding:26px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}
.big-state .v{font-size:2.2rem;font-weight:800}
.stack{display:flex;flex-direction:column;gap:10px}
.seg{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line);gap:2px}
.seg i{display:block;height:100%;min-width:0}
.s1{background:var(--c1)}.s2{background:var(--c2)}.s3{background:var(--c3)}.s4{background:var(--c4)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:8px}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.paper-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;background:var(--raise);border-bottom:2px solid var(--line)}
.paper-h h3{margin:0;font-family:var(--f-brand);font-size:1.1rem}
.pl{display:grid;grid-template-columns:minmax(0,1fr) 92px 96px;gap:8px;align-items:center;padding:6px 14px;border-bottom:1px dashed var(--line);min-height:50px}
.pl.head{font-size:.75rem;font-weight:700;color:var(--muted);min-height:34px}
.pl .inp{min-height:42px;padding:0 10px;font-size:1rem;text-align:center}
.pl .val{text-align:end;font-size:.95rem}
.pl .nm{font-weight:700;overflow-wrap:anywhere}
.chart{width:100%;height:auto;display:block}
.chart .ct{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .cv{fill:var(--ink);font-size:11px;font-weight:700;font-family:var(--f-body)}
.chart .bar{fill:var(--tint);stroke:var(--accent);stroke-width:1}
.chart .bar.hl{fill:var(--accent)}
.chart .base{stroke:var(--line);stroke-width:1}
.chart .grid-l{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--tint)}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.hbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.hbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.toast{position:fixed;inset-inline:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));max-width:448px;margin-inline:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:700;text-align:center;z-index:60;box-shadow:var(--shadow)}
.backdrop{position:fixed;inset:0;background:rgba(8,14,26,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 4px 8px 16px;padding:8px 16px}
.sh-head h2{margin:0;font-size:1.15rem;font-weight:800}
.sh-body{overflow-y:auto;padding:6px 16px 14px;display:flex;flex-direction:column;gap:12px}
.sh-foot{padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;background:var(--surface)}
.sh-foot .btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .btn{min-height:44px;padding:0 16px}
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;padding:10px 0;align-items:center}
.cl+.cl{border-top:1px dashed var(--line)}
.cl .nm{font-weight:800;overflow-wrap:anywhere}
.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;height:42px;border-radius:12px;background:var(--tint);color:var(--accent);display:grid;place-items:center}
.step b{min-width:44px;text-align:center}
.cl .inp{min-height:42px;max-width:120px;padding:0 10px}
.warn-box{background:var(--warn-bg);color:var(--warn);padding:10px 12px;border-radius:12px;font-weight:700;font-size:.9rem}
.bad-box{background:var(--bad-bg);color:var(--bad);padding:10px 12px;border-radius:12px;font-weight:700;font-size:.9rem}
.receipt{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.receipt h4{margin:0;text-align:center;font-family:var(--f-brand);font-size:1.3rem}
.receipt .r{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.receipt hr{border:0;border-top:1px dashed var(--line);margin:6px 0;width:100%}
.login{flex:1;overflow-y:auto;padding:36px 20px 24px;display:flex;flex-direction:column;gap:18px;justify-content:center}
.login h1{margin:0;font-family:var(--f-brand);font-size:2.4rem;color:var(--accent);text-align:center}
.login p{margin:0;text-align:center;color:var(--muted)}
.diff{display:inline-flex;gap:6px;align-items:center;font-weight:800}
.empty-note{color:var(--muted);text-align:center;padding:14px 0;font-size:.92rem}
.sub-date{font-size:.9rem;color:var(--muted);font-weight:600}
.pill-row{display:flex;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

/* ---------- selectors ---------- */
function prodById(id){return S.prod.filter(function(p){return p.id===+id})[0]}
function svcById(id){return S.svc.filter(function(w){return w.id===id})[0]}
function dayOpen(){return !!S.day&&!S.day.closed}
function daySales(){return S.day?S.sales.filter(function(s){return s.day===S.day.id&&!s.voided}):[]}
function dayExp(){return S.day?S.exp.filter(function(e){return e.day===S.day.id}):[]}
function cashExpected(){var d=S.day;if(!d)return 0;return d.opening+sum(daySales(),function(s){return s.total})-sum(dayExp(),function(e){return e.amount})}
function lowStock(){return S.prod.filter(function(p){return !p.hidden&&p.stock<=p.thr})}
function missingPrice(){return S.prod.filter(function(p){return !p.hidden&&(p.sell==null||p.buy==null)})}
function logit(type,text){S.log.unshift({t:new Date().toISOString(),type:type,text:text});if(S.log.length>300)S.log.length=300}
function wlog(w,kind,delta){S.wlog.unshift({at:new Date().toISOString(),sid:w.id,kind:kind,delta:delta,bal:w.bal});if(S.wlog.length>200)S.wlog.length=200}

/* ---------- charts ---------- */
function bars(data,h){
  var W=340,n=data.length,bw=W/n,max=Math.max.apply(null,data.map(function(d){return d.v}).concat([1]));
  var s='<svg class="chart" viewBox="0 0 '+W+' '+(h+34)+'" role="img" aria-label="رسم بياني بالأعمدة">';
  s+='<line class="grid-l" x1="0" x2="'+W+'" y1="'+(16)+'" y2="16"/><line class="base" x1="0" x2="'+W+'" y1="'+(h+16)+'" y2="'+(h+16)+'"/>';
  data.forEach(function(d,i){
    var bh=Math.round(d.v/max*h),x=(n-1-i)*bw+bw*0.16,w=bw*0.68;
    s+='<rect class="bar'+(d.hl?' hl':'')+'" x="'+x.toFixed(1)+'" y="'+(h+16-bh)+'" width="'+w.toFixed(1)+'" height="'+bh+'" rx="3"/>';
    s+='<text class="ct" x="'+(x+w/2).toFixed(1)+'" y="'+(h+30)+'" text-anchor="middle">'+d.l+'</text>';
    if(d.hl)s+='<text class="cv" x="'+(x+w/2).toFixed(1)+'" y="'+(h+16-bh-5)+'" text-anchor="middle">'+d.t+'</text>';
  });
  return s+'</svg>';
}
function line(data,h){
  var W=340,n=data.length,vals=data.map(function(d){return d.v}),mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals);
  var span=Math.max(mx-mn,1),top=22,H=h;
  var X=function(i){return 14+(n-1-i)*((W-28)/Math.max(n-1,1))};
  var Y=function(v){return top+(1-(v-mn)/span)*(H-top-8)};
  var pts=data.map(function(d,i){return X(i).toFixed(1)+','+Y(d.v).toFixed(1)});
  var area='M'+X(0).toFixed(1)+','+(H)+' L'+pts.join(' L')+' L'+X(n-1).toFixed(1)+','+H+' Z';
  var s='<svg class="chart" viewBox="0 0 '+W+' '+(H+22)+'" role="img" aria-label="اتجاه مجاميع الإغلاق">';
  s+='<line class="grid-l" x1="0" x2="'+W+'" y1="'+top+'" y2="'+top+'"/><line class="grid-l" x1="0" x2="'+W+'" y1="'+((top+H)/2).toFixed(1)+'" y2="'+((top+H)/2).toFixed(1)+'"/><line class="base" x1="0" x2="'+W+'" y1="'+H+'" y2="'+H+'"/>';
  s+='<path class="ar" d="'+area+'"/><polyline class="ln" points="'+pts.join(' ')+'"/>';
  s+='<circle class="pt" cx="'+X(0).toFixed(1)+'" cy="'+Y(vals[0]).toFixed(1)+'" r="5"/>';
  s+='<text class="cv" x="'+Math.min(Math.max(X(0),30),W-30).toFixed(1)+'" y="'+(Y(vals[0])-10).toFixed(1)+'" text-anchor="middle">'+fmt(vals[0])+'</text>';
  s+='<text class="ct" x="'+X(0).toFixed(1)+'" y="'+(H+16)+'" text-anchor="middle">'+data[0].l+'</text>';
  s+='<text class="ct" x="'+X(n-1).toFixed(1)+'" y="'+(H+16)+'" text-anchor="middle">'+data[n-1].l+'</text>';
  return s+'</svg>';
}

    }else{
      h+='<div class="pl head"><span>العنصر</span><span style="text-align:center">الكمية</span><span style="text-align:end">القيمة</span></div>'+s[2].map(function(p){return '<div class="pl"><span class="nm">'+esc(p.name)+(p.buy==null?' <span class="badge warn">بلا سعر</span>':'')+'</span><input class="inp num" inputmode="decimal" data-live="invQty" data-id="'+p.id+'" value="'+fq(INV.qty[p.id],p.unit)+'" aria-label="كمية '+esc(p.name)+'"><span class="val m" id="iv-'+p.id+'">'+fmt(invVal(p))+'</span></div>'}).join('');

  return h;
}
function recalcInv(){
  if(!INV||!$('#gt'))return;
  var secs=invSections(),totals={};
  secs.forEach(function(s){
    var v=0;
    if(s[0]==='cash')v=INV.cash||0;
    else if(s[0]==='svc')v=sum(s[2],function(w){return INV.bal[w.id]||0});
    else v=sum(s[2],invVal);
    totals[s[0]]=v;
  });
  var gt=sum(secs,function(s){return totals[s[0]]});
  secs.forEach(function(s){
    $('#st-'+s[0]).innerHTML=money(totals[s[0]]);
    var pc=gt>0?totals[s[0]]/gt*100:0;
    $('#pc-'+s[0]).textContent=pc.toFixed(1)+'%';
    $('#sg-'+s[0]).style.width=pc+'%';
  });
  $('#gt').innerHTML=money(gt);
  var prev=S.inv.length?S.inv[S.inv.length-1]:null,gd=$('#gd');
  if(prev){var df=gt-prev.total;gd.className='diff '+(df>=0?'pos':'neg');gd.innerHTML=(df>0?'+':'')+fmt(df)+' <span class="u">TND</span>'}
  INV.totals=totals;INV.gt=gt;
}

function vReports(){
  var live=daySales(),tot=sum(live,function(s){return s.total});
  var data;
  if(UI.rp==='d'){
    data=S.hist.slice(-9).map(function(h){return {l:h.date.slice(8),v:h.sales,t:'',hl:false}});
    data.push({l:'اليوم',v:Math.max(tot,1),t:fmt(tot),hl:true});
  }else{
    var m=new Date().getMonth(),vals=[9820,10450,9980,11230,10870];
    data=vals.map(function(v,i){return {l:MONTHS[(m-5+i+12)%12],v:v*1000,t:'',hl:false}});
    data.push({l:MONTHS[m],v:6230000+tot,t:fmt(6230000+tot),hl:true});
  }
  var cp={tobacco:412300,mech:268500,misc:64300,svc:189200};
  S.sales.filter(function(s){return !s.voided}).forEach(function(s){s.lines.forEach(function(l){var p=lp(l);if(p!=null)cp[l.cat]+=p})});
  var cmax=Math.max.apply(null,Object.keys(cp).map(function(k){return cp[k]}));
  var top={'البنزين':1617000,'Marlboro':1136000,'Inter':637200,'Cristal':531000,'زيت 4T':418000,'Safi':309600};
  S.sales.filter(function(s){return !s.voided}).forEach(function(s){s.lines.forEach(function(l){if(!l.svc)top[l.name]=(top[l.name]||0)+lt(l)})});
  var tl=Object.keys(top).map(function(k){return [k,top[k]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,6),tmax=tl[0][1];
  var low=lowStock();
  var cl=S.hist.slice(-14).map(function(h){return {l:h.date.slice(8),v:h.closing}});
  return '<div class="tabs"><button class="tab'+(UI.rp==='d'?' on':'')+'" data-act="rp" data-p="d">يومي</button><button class="tab'+(UI.rp==='m'?' on':'')+'" data-act="rp" data-p="m">شهري</button></div>'+
  '<section class="card"><h3>المبيعات '+(UI.rp==='d'?'اليومية':'الشهرية')+'</h3>'+bars(data,120)+'</section>'+
  '<section class="card"><h3>الربح حسب الفئة (هذا الشهر)</h3>'+Object.keys(cp).map(function(k){return '<div class="stack" style="gap:4px"><div class="hd"><span>'+CN[k]+'</span>'+money(cp[k])+'</div><div class="hbar"><i style="width:'+(cp[k]/cmax*100).toFixed(1)+'%"></i></div></div>'}).join('')+'<div class="mut" style="font-size:.78rem">لا تدخل المنتجات بلا سعر شراء في حساب الربح.</div></section>'+
  '<section class="card"><h3>الأكثر مبيعًا</h3>'+tl.map(function(t){return '<div class="stack" style="gap:4px"><div class="hd"><span>'+esc(t[0])+'</span>'+money(t[1])+'</div><div class="hbar"><i style="width:'+(t[1]/tmax*100).toFixed(1)+'%"></i></div></div>'}).join('')+'</section>'+
  '<section class="card"><h3>المخزون المنخفض</h3>'+(low.length?low.map(function(p){return '<div class="row"><div class="l"><b>'+esc(p.name)+'</b><small>حد التنبيه '+fq(p.thr,p.unit)+'</small></div><span class="neg"><span class="m">'+fq(p.stock,p.unit)+'</span> '+UN(p.unit)+'</span></div>'}).join(''):'<div class="empty-note">لا شيء منخفض.</div>')+'</section>'+
  '<section class="card"><h3>اتجاه مجاميع الإغلاق</h3>'+line(cl,120)+'</section>'+
  '<section class="card"><h3>تاريخ أرصدة المحافظ</h3>'+walletHist(10)+'</section>';
}

 },

 },

 },

   var a=pm($('#exAmt').value),r=$('#exWhy').value.trim();

   if(!r){toast('السبب مطلوب');return}
   S.exp.push({id:S.nextId++,day:S.day.id,at:new Date().toISOString(),amount:a,reason:r,kind:'exp'});
   logit('مصروف','مصروف '+r+' بقيمة '+fmt(a));save();render();toast('سُجّل المصروف');
 },
 closeAsk:function(){closeSheetCash()},
 doClose:function(){
   var c=pm($('#clIn').value);if(c==null||c<0){toast('أدخل النقد المعدود');return}
   var d=S.day,exp=cashExpected(),ds=daySales();
   d.closed=true;d.counted=c;d.expected=exp;d.diff=c-exp;d.closedAt=new Date().toISOString();d.note=$('#clNote').value;

   S.hist.push({date:d.date,sales:sum(ds,function(s){return s.total}),profit:sum(ds,saleProfit),closing:c});
   logit('صندوق','إغلاق الصندوق. المتوقع '+fmt(exp)+' والمعدود '+fmt(c)+' والفرق '+fmt(c-exp));
   save();closeSheet();render();toast('أُغلق الصندوق');
 },
 invPdf:function(){toast('تصدير PDF يُفعَّل في التطبيق الفعلي. هذه واجهة تجريبية.')},
 invSave:function(){
   recalcInv();

     sheet('تحديث المخزون؟','<div>حُفظ الجرد. توجد '+diffs.length+' منتجات كميتها المعدودة تختلف عن مخزون النظام:</div><div class="card">'+diffs.map(function(p){return '<div class="row"><span>'+esc(p.name)+'</span><span class="m">'+fq(p.stock,p.unit)+' ← '+fq(INV.qty[p.id],p.unit)+'</span></div>'}).join('')+'</div>',
       '<button class="btn ghost" data-act="closeSheet">إبقاء المخزون</button><button class="btn primary" data-act="invApply">تحديث المخزون</button>');
   }else{toast('حُفظ الجرد');render()}
 },

   S.prod.forEach(function(p){if(!p.hidden&&INV.qty[p.id]!=null&&r3(INV.qty[p.id])!==r3(p.stock)){logit('منتج','تصحيح مخزون '+p.name+' من '+fq(p.stock,p.unit)+' إلى '+fq(INV.qty[p.id],p.unit));p.stock=r3(INV.qty[p.id])}});

     var u=$('#fUnit').value;
     S.prod.push({id:S.nextProd++,cat:'misc',name:n,buy:v.buy,sell:v.sell,stock:v.stock,thr:v.thr,unit:u,hidden:false});

   }else{
     var p=prodById(id),ch=[];
     if(p.sell!==v.sell)ch.push('البيع '+(p.sell==null?'—':fmt(p.sell))+' ← '+(v.sell==null?'—':fmt(v.sell)));
     if(p.buy!==v.buy)ch.push('الشراء '+(p.buy==null?'—':fmt(p.buy))+' ← '+(v.buy==null?'—':fmt(v.buy)));

     logit('منتج','تعديل '+n+(ch.length?' ('+ch.join('، ')+')':''));
   }

 },

 importData:function(){

 },
 logout:function(){S.session=false;save();render()},
 login:function(){

 }

}

});

});

  if(e.key==='Escape'&&$('#sheet-root .backdrop'))closeSheet();

render();
